<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Η Γενοκτονία των Ποντίων – Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #f0f7ff; min-height: 100vh; padding: 20px; }

  header { text-align: center; padding: 24px 16px 16px; }
  header h1 { font-size: 1.7rem; font-weight: 800; color: #1a5c8a; }
  header p { color: #5a7fa0; font-size: 0.95rem; margin-top: 4px; }

  .progress-bar { width: 100%; max-width: 560px; margin: 12px auto; background: #d6e8f5; border-radius: 99px; height: 10px; }
  .progress-fill { height: 10px; background: linear-gradient(90deg, #2196a8, #1a5c8a); border-radius: 99px; transition: width 0.4s; }
  .progress-label { text-align: center; font-size: 0.85rem; color: #5a7fa0; margin-top: 4px; }

  .card-area { display: flex; justify-content: center; align-items: center; min-height: 360px; perspective: 1000px; margin: 10px 0; }

  .card { width: 100%; max-width: 560px; height: 340px; position: relative; transform-style: preserve-3d; transition: transform 0.55s ease; cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }

  .face { position: absolute; inset: 0; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; backface-visibility: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }

  .front { background: linear-gradient(135deg, #1a5c8a 0%, #2196a8 100%); color: white; }
  .front .card-num { font-size: 0.8rem; opacity: 0.7; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .front .card-img { width: 130px; height: 100px; object-fit: cover; border-radius: 10px; margin-bottom: 14px; border: 3px solid rgba(255,255,255,0.4); }
  .front .card-img-placeholder { width: 130px; height: 100px; border-radius: 10px; margin-bottom: 14px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
  .front .question { font-size: 1.15rem; font-weight: 700; text-align: center; line-height: 1.5; }
  .front .hint { font-size: 0.78rem; opacity: 0.65; margin-top: 12px; }

  .back { background: white; color: #1a3a52; transform: rotateY(180deg); }
  .back .answer-label { font-size: 0.75rem; color: #2196a8; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .back .answer { font-size: 1.05rem; font-weight: 600; text-align: center; line-height: 1.6; color: #1a3a52; }
  .back .extra { font-size: 0.85rem; color: #5a7fa0; margin-top: 10px; text-align: center; line-height: 1.5; }

  .controls { display: flex; justify-content: center; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  .btn { padding: 10px 28px; border: none; border-radius: 99px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-prev { background: white; color: #1a5c8a; border: 2px solid #1a5c8a; }
  .btn-prev:hover { background: #e8f2fa; }
  .btn-flip { background: #1a5c8a; color: white; }
  .btn-flip:hover { background: #154d75; transform: scale(1.04); }
  .btn-next { background: #2196a8; color: white; }
  .btn-next:hover { background: #1a7d8e; transform: scale(1.04); }

  .footer { text-align: center; color: #aaa; font-size: 0.78rem; margin-top: 24px; padding-top: 12px; border-top: 1px solid #dde; }

  .img-credit { font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>🕊️ Η Γενοκτονία των Ποντίων</h1>
  <p>Κάνε κλικ στην κάρτα για να δεις την απάντηση</p>
</header>

<div class="progress-bar"><div class="progress-fill" id="pbar"></div></div>
<div class="progress-label" id="plabel"></div>

<div class="card-area">
  <div class="card" id="card" onclick="flipCard()">
    <div class="face front" id="front"></div>
    <div class="face back" id="back"></div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-prev" onclick="go(-1)">← Προηγούμενη</button>
  <button class="btn btn-flip" onclick="flipCard()">🔄 Γύρισε</button>
  <button class="btn btn-next" onclick="go(1)">Επόμενη →</button>
</div>

<div class="footer">© myspiderwebsite | Christina Papadimitriou</div>

<script>
const cards = [
  {
    q: "Ποιοι ήταν οι Πόντιοι;",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Map_of_Pontus.png/320px-Map_of_Pontus.png",
    imgCredit: "Wikimedia Commons (Public Domain)",
    a: "Έλληνες που ζούσαν στον Πόντο",
    extra: "Η πατρίδα τους, ο Πόντος, βρισκόταν στα νότια παράλια της Μαύρης Θάλασσας — εκεί ζούσαν εδώ και χιλιάδες χρόνια."
  },
  {
    q: "Πού βρισκόταν ο Πόντος;",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Black_Sea_map.png/320px-Black_Sea_map.png",
    imgCredit: "Wikimedia Commons (Public Domain)",
    a: "Στα νότια παράλια της Μαύρης Θάλασσας",
    extra: "Η περιοχή αυτή ανήκει σήμερα στη βόρεια Τουρκία."
  },
  {
    q: "Ποια κυβέρνηση ήταν υπεύθυνη για τη Γενοκτονία;",
    emoji: "🏛️",
    a: "Η κυβέρνηση της Οθωμανικής Αυτοκρατορίας",
    extra: "Ήταν πολιτική απόφαση μιας συγκεκριμένης κυβέρνησης — δεν εκπροσωπεί έναν ολόκληρο λαό ή θρησκεία."
  },
  {
    q: "Τι ήταν τα «τάγματα εργασίας»;",
    emoji: "⛏️",
    a: "Ομάδες στις οποίες στέλνονταν αναγκαστικά οι εκτοπισμένοι για σκληρή δουλειά",
    extra: "Οι συνθήκες ήταν εξαντλητικές: έλλειψη τροφής, νερού και ιατρικής φροντίδας."
  },
  {
    q: "Πότε έγιναν τα κύρια γεγονότα της Γενοκτονίας;",
    emoji: "📅",
    a: "Μεταξύ 1916 και 1923",
    extra: "Αυτά τα χρόνια σημαδεύτηκαν από εκτοπισμούς, πορείες θανάτου και τάγματα εργασίας."
  },
  {
    q: "Πόσοι Πόντιοι έχασαν τη ζωή τους;",
    emoji: "🕯️",
    a: "Πάνω από 300.000 άνθρωποι",
    extra: "Πέθαναν από βία, εξάντληση, πείνα και αρρώστιες κατά τη διάρκεια των εκτοπισμών."
  },
  {
    q: "Τι έγινε με τους Ποντίους που επέζησαν;",
    emoji: "🚢",
    a: "Ήρθαν στην Ελλάδα ως πρόσφυγες",
    extra: "Άφησαν πίσω τους τα σπίτια, τις περιουσίες και τα χωριά τους και ξεκίνησαν τη ζωή τους από μηδέν."
  },
  {
    q: "Πότε είναι η Ημέρα Μνήμης για τη Γενοκτονία των Ποντίων;",
    emoji: "🕊️",
    a: "19η Μαΐου",
    extra: "Κάθε χρόνο την ημέρα αυτή τιμούμε τη μνήμη όλων όσων έχασαν τη ζωή τους ή αναγκάστηκαν να εγκαταλείψουν την πατρίδα τους."
  },
  {
    q: "Ποιοι άλλοι λαοί υπέφεραν την ίδια εποχή από την ίδια κυβέρνηση;",
    emoji: "🌍",
    a: "Οι Αρμένιοι και οι Ασσύριοι",
    extra: "Και αυτοί ήταν χριστιανικοί πληθυσμοί που στοχοποιήθηκαν από την οθωμανική κυβέρνηση την ίδια περίοδο."
  },
  {
    q: "Τι σημαίνει η λέξη «γενοκτονία»;",
    emoji: "📖",
    a: "Η συστηματική εξόντωση ενός λαού ή εθνικής ομάδας",
    extra: "Είναι ένα από τα πιο σοβαρά εγκλήματα κατά της ανθρωπότητας και καταδικάζεται από το διεθνές δίκαιο."
  }
];

let current = 0;
let flipped = false;

function render() {
  const c = cards[current];
  const front = document.getElementById('front');
  const back = document.getElementById('back');
  const card = document.getElementById('card');

  card.classList.remove('flipped');
  flipped = false;

  let imgHtml = '';
  if (c.img) {
    imgHtml = `<img class="card-img" src="${c.img}" alt="Εικόνα" onerror="this.style.display='none'">`;
    if (c.imgCredit) imgHtml += `<div class="img-credit">${c.imgCredit}</div>`;
  } else if (c.emoji) {
    imgHtml = `<div class="card-img-placeholder">${c.emoji}</div>`;
  }

  front.innerHTML = `
    <div class="card-num">Κάρτα ${current + 1} από ${cards.length}</div>
    ${imgHtml}
    <div class="question">${c.q}</div>
    <div class="hint">👆 Κλικ για απάντηση</div>
  `;

  back.innerHTML = `
    <div class="answer-label">Απάντηση</div>
    <div class="answer">${c.a}</div>
    ${c.extra ? `<div class="extra">${c.extra}</div>` : ''}
  `;

  const pct = ((current + 1) / cards.length * 100).toFixed(0);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = `${current + 1} / ${cards.length}`;
}

function flipCard() {
  const card = document.getElementById('card');
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function go(dir) {
  current = (current + dir + cards.length) % cards.length;
  render();
}

render();
</script>
</body>
</html>
