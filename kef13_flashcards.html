<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Κεφάλαιο 13 – Καρτέλες Εξάσκησης | Οι αγώνες του Καραϊσκάκη</title>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2744;
    --gold: #c8922a;
    --gold-light: #f5d98b;
    --cream: #fdf6e3;
    --red: #8b1a1a;
    --white: #ffffff;
    --shadow: 0 8px 32px rgba(26,39,68,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: linear-gradient(135deg, #1a2744 0%, #2c3e6b 50%, #1a2744 100%);
    min-height: 100vh;
    padding: 20px 16px 40px;
    color: var(--navy);
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-family: 'GFS Didot', serif;
    color: var(--gold-light);
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  header p {
    color: rgba(245,217,139,0.7);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
    color: var(--gold-light);
  }

  .stat-num {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    opacity: 0.8;
    text-transform: uppercase;
  }

  /* Card scene */
  .scene {
    width: 100%;
    max-width: 560px;
    height: 260px;
    margin: 0 auto 20px;
    perspective: 1000px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }

  .card-front {
    background: linear-gradient(145deg, #ffffff, #fdf6e3);
    border: 2px solid var(--gold);
    box-shadow: var(--shadow);
  }

  .card-back {
    background: linear-gradient(145deg, var(--navy), #2c3e6b);
    border: 2px solid var(--gold);
    box-shadow: var(--shadow);
    transform: rotateY(180deg);
  }

  .card-tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  .card-front .card-tag { background: var(--gold); color: white; }
  .card-back .card-tag { background: var(--gold); color: var(--navy); }

  .card-num {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 0.75rem;
    opacity: 0.45;
  }
  .card-front .card-num { color: var(--navy); }
  .card-back .card-num { color: white; }

  .card-question {
    font-family: 'GFS Didot', serif;
    font-size: clamp(1rem, 3vw, 1.25rem);
    line-height: 1.5;
    color: var(--navy);
  }

  .card-answer {
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    line-height: 1.6;
    color: var(--gold-light);
    font-weight: 600;
  }

  .tap-hint {
    font-size: 0.72rem;
    color: var(--navy);
    opacity: 0.4;
    margin-top: 14px;
    letter-spacing: 0.06em;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 50px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }

  .btn-prev, .btn-next {
    background: var(--gold);
    color: white;
    min-width: 100px;
  }

  .btn-prev:hover, .btn-next:hover {
    background: #a87520;
    transform: translateY(-1px);
  }

  .btn-shuffle {
    background: transparent;
    color: var(--gold-light);
    border: 1.5px solid var(--gold);
    font-size: 0.82rem;
  }

  .btn-shuffle:hover { background: rgba(200,146,42,0.15); }

  .btn-reset {
    background: var(--red);
    color: white;
    font-size: 0.82rem;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 560px;
    margin: 0 auto 8px;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* Score buttons */
  .score-btns {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .btn-knew { background: #2e7d32; color: white; }
  .btn-knew:hover { background: #1b5e20; }
  .btn-didnt { background: var(--red); color: white; }
  .btn-didnt:hover { background: #6a0000; }

  .score-hint {
    text-align: center;
    color: rgba(245,217,139,0.6);
    font-size: 0.78rem;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }

  footer {
    text-align: center;
    color: rgba(245,217,139,0.35);
    font-size: 0.72rem;
    margin-top: 30px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<header>
  <h1>Κεφάλαιο 13 – Οι αγώνες του Καραϊσκάκη</h1>
  <p>Καρτέλες Εξάσκησης · ΣΤ΄ Δημοτικού</p>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="statTotal">20</div>
    <div class="stat-label">Σύνολο</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statKnew" style="color:#81c784">0</div>
    <div class="stat-label">Τα ήξερα</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statDidnt" style="color:#e57373">0</div>
    <div class="stat-label">Για μελέτη</div>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill" style="width:5%"></div>
</div>

<div class="scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="card-tag">Ερώτηση</div>
      <div class="card-num" id="cardNum"></div>
      <div class="card-question" id="questionText"></div>
      <div class="tap-hint">↕ Πάτησε για να δεις την απάντηση</div>
    </div>
    <div class="card-face card-back">
      <div class="card-tag">Απάντηση</div>
      <div class="card-num" id="cardNum2"></div>
      <div class="card-answer" id="answerText"></div>
    </div>
  </div>
</div>

<div class="score-hint" id="scoreHint" style="display:none">Πώς τα πήγες;</div>
<div class="score-btns" id="scoreBtns" style="display:none">
  <button class="btn btn-knew" onclick="markKnew()">✓ Το ήξερα</button>
  <button class="btn btn-didnt" onclick="markDidnt()">✗ Για μελέτη</button>
</div>

<div class="controls">
  <button class="btn btn-prev" onclick="prevCard()">← Προηγ.</button>
  <button class="btn btn-next" onclick="nextCard()">Επόμ. →</button>
  <button class="btn btn-shuffle" onclick="shuffleCards()">🔀 Ανακάτεμα</button>
  <button class="btn btn-reset" onclick="resetAll()">↺ Επαναφορά</button>
</div>

<script>
const allCards = [
  { q: "Ποιος ήταν ο Γεώργιος Καραϊσκάκης;", a: "Ήταν πρώην κλέφτης και αρματολός της Στερεάς Ελλάδας, που έγινε ο αρχιστράτηγος των ελληνικών δυνάμεων στη Στερεά κατά την Επανάσταση." },
  { q: "Τι συνέβη στο Μεσολόγγι τον Απρίλιο του 1826;", a: "Το Μεσολόγγι έπεσε στα χέρια των Οθωμανών μετά από μακρόχρονη πολιορκία. Η τραγική Έξοδος σηματοδότησε μεγάλη κρίση για την Επανάσταση." },
  { q: "Ποιος ήταν ο Κιουταχής;", a: "Ο Κιουταχής (Ρεσίτ Πασάς) ήταν ο Οθωμανός στρατηγός που πολιόρκησε το Μεσολόγγι και στη συνέχεια προχώρησε στην Αττική για να καταστείλει την Επανάσταση στη Ρούμελη." },
  { q: "Τι είναι η Ρούμελη;", a: "Έτσι ονομαζόταν η Στερεά Ελλάδα, από την τουρκική λέξη Rumili που σημαίνει «χώρα των Ρωμιών»." },
  { q: "Γιατί ο Κιουταχής προχώρησε στην Αττική μετά το Μεσολόγγι;", a: "Ήθελε να καταστείλει εντελώς την Επανάσταση στη Ρούμελη, κυριεύοντας και την Αθήνα και πολιορκώντας την Ακρόπολη." },
  { q: "Ποιος υπεράσπιζε αρχικά την Ακρόπολη;", a: "Η ελληνική φρουρά με αρχηγό τον στρατηγό Γιάννη Γκούρα." },
  { q: "Τι αποστολή ανέλαβε ο Καραϊσκάκης το φθινόπωρο του 1826;", a: "Διορίστηκε αρχιστράτηγος στη Στερεά Ελλάδα με στόχο να αντιμετωπίσει τον Κιουταχή και να σώσει την Ακρόπολη." },
  { q: "Τι σήμαινε η στρατηγική του «αντιπερισπασμού» που χρησιμοποίησε ο Καραϊσκάκης;", a: "Αντί να επιτεθεί απευθείας, κινήθηκε στα νώτα των Τούρκων, στη Στερεά Ελλάδα, αναγκάζοντάς τους να αποσύρουν στρατεύματα από την Ακρόπολη για να τον αντιμετωπίσουν." },
  { q: "Πού και πότε νίκησε ο Καραϊσκάκης τους Τούρκους στη Βοιωτία;", a: "Στο Δίστομο και στην Αράχοβα τον Νοέμβριο του 1826. Η Μάχη της Αράχοβας διήρκεσε επτά μέρες και κατέληξε σε μεγάλη ελληνική νίκη." },
  { q: "Πότε είχε ο Καραϊσκάκης εκδιώξει τους Τούρκους από το μεγαλύτερο μέρος της Στερεάς;", a: "Στις αρχές του 1827." },
  { q: "Ποιοι Άγγλοι αξιωματικοί ανέλαβαν την αρχηγία των ελληνικών δυνάμεων το 1827;", a: "Ο σερ Ρίτσαρντ Τσώρτς (χερσαίες δυνάμεις) και ο λόρδος Κόχραν (ναυτικές δυνάμεις)." },
  { q: "Πώς τραυματίστηκε θανάσιμα ο Καραϊσκάκης;", a: "Αν και άρρωστος με πυρετό, όρμησε πάνω στο άλογό του σε μια απροσδόκητη συμπλοκή στα φυλάκια και τραυματίστηκε θανάσιμα." },
  { q: "Πότε πέθανε ο Καραϊσκάκης;", a: "Στις 23 Απριλίου 1827, στο Νέο Φάληρο." },
  { q: "Τι είπε ο Καραϊσκάκης στους αρχηγούς πριν πεθάνει;", a: "Τους συνέστησε να έχουν ομόνοια μεταξύ τους και να συνεχίσουν τον αγώνα για την ελευθερία της Ελλάδας." },
  { q: "Τι συνέπειες είχε ο θάνατος του Καραϊσκάκη;", a: "Η μάχη που ακολούθησε κατέληξε σε καταστροφή: σημαντικοί οπλαρχηγοί (Δράκος, Βέικος) και πάνω από χίλιοι αγωνιστές σκοτώθηκαν." },
  { q: "Πότε παραδόθηκε η Ακρόπολη στους Τούρκους;", a: "Τον Μάιο του 1827, περίπου ένα μήνα μετά τον θάνατο του Καραϊσκάκη." },
  { q: "Τι είναι ο «αντιπερισπασμός» ως πολεμική έννοια;", a: "Πολεμική ενέργεια που πραγματοποιείται για να αποσπαστεί η προσοχή του αντιπάλου σε άλλο σημείο από αυτό που επιδιώκουμε να πλήξουμε." },
  { q: "Πού έγινε η Μάχη της Αράχοβας και πόσο κράτησε;", a: "Η Αράχοβα είναι χωριό της Βοιωτίας. Η μάχη έγινε τον Νοέμβριο του 1826 και κράτησε επτά μέρες." },
  { q: "Σε ποιο στάδιο της Επανάστασης έδρασε ο Καραϊσκάκης;", a: "Στη δύσκολη φάση 1826–1827, μετά την πτώση του Μεσολογγίου, όταν η Επανάσταση κινδύνευε σοβαρά." },
  { q: "Γιατί ο Καραϊσκάκης θεωρείται από τους σημαντικότερους ήρωες της Επανάστασης;", a: "Γιατί με την έξυπνη στρατηγική του (αντιπερισπασμός, Μάχη Αράχοβας) κατάφερε να ανατρέψει την κατάσταση στη Στερεά, εμπνέοντας τους αγωνιστές σε μια από τις πιο κρίσιμες περιόδους." },
];

let deck = [...allCards];
let current = 0;
let knew = 0;
let didnt = 0;
let flipped = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function loadCard() {
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('questionText').textContent = deck[current].q;
  document.getElementById('answerText').textContent = deck[current].a;
  document.getElementById('cardNum').textContent = (current + 1) + ' / ' + deck.length;
  document.getElementById('cardNum2').textContent = (current + 1) + ' / ' + deck.length;
  document.getElementById('scoreHint').style.display = 'none';
  document.getElementById('scoreBtns').style.display = 'none';
  const pct = Math.round(((current + 1) / deck.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('statKnew').textContent = knew;
  document.getElementById('statDidnt').textContent = didnt;
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
  if (flipped) {
    document.getElementById('scoreHint').style.display = 'block';
    document.getElementById('scoreBtns').style.display = 'flex';
  } else {
    document.getElementById('scoreHint').style.display = 'none';
    document.getElementById('scoreBtns').style.display = 'none';
  }
}

function markKnew() { knew++; nextCard(); }
function markDidnt() { didnt++; nextCard(); }

function nextCard() {
  if (current < deck.length - 1) { current++; loadCard(); }
  else { alert('Τέλος καρτελών! Έφτασες στο τέλος. 🎉'); }
}

function prevCard() {
  if (current > 0) { current--; loadCard(); }
}

function shuffleCards() {
  shuffle(deck);
  current = 0;
  loadCard();
}

function resetAll() {
  deck = [...allCards];
  current = 0;
  knew = 0;
  didnt = 0;
  loadCard();
}

loadCard();
</script>

</body>
</html>
